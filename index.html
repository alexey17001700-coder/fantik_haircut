<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детская парикмахерская Фантик</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: url('https://via.placeholder.com/1500x1000/cccccc/ffffff?text=') no-repeat center center fixed;
            background-size: cover;
            background-blend-mode: multiply;
            filter: blur(5px);
            -webkit-filter: blur(5px);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Детская парикмахерская "Фантик"</h1>
        <p>Мы делаем детей счастливыми, а родителей спокойными!</p>
        <p>Телефон: +7 (250) 240</p>
        <a href="tel:+7250240">Записаться на стрижку</a>
    </div>
</body>
</html>
